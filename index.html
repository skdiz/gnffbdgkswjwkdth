<script>
(function(){

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const pc=(a,b)=>b?Math.round(a/b*100):0;
const md2=d=>`${d.getMonth()+1}월 ${d.getDate()}일`;
const fd=d=>`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
const hm=d=>{const h=d.getHours();return `${h<12?'오전':'오후'} ${h%12||12}:${String(d.getMinutes()).padStart(2,'0')}`};
const hr=h=>`${h<5?'새벽':h<12?'오전':h<18?'오후':h<21?'저녁':'밤'} ${h%12||12}시`;
const dkey=d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
const WD='일월화수목금토';
function to24(ap,h){h=+h;if(ap==='오후'&&h<12)h+=12;if(ap==='오전'&&h===12)h=0;return h}
const SYS=/(님이 들어왔습니다|님이 나갔습니다|초대했습니다|내보냈습니다|채팅방 관리자)/;
const MEDIA=/^(사진( \d+장)?|동영상|이모티콘|음성메시지|링크|파일: .*|삭제된 메시지입니다\.?)$/;
const LAUGH=/[ㅋㅎ]{2,}/;
const PROM=/(다음에|조만간|언제 ?한 ?번|나중에).{0,12}(보자|만나|먹자|가자|놀자|마시자)/;
const STOP=new Set('그냥 진짜 근데 나도 너도 너무 이거 그거 저거 우리 그래서 그리고 아니 혹시 오늘 지금 이제 그럼 그래 내가 니가 네가 완전 약간 사진 이모티콘 동영상 삭제된 메시지입니다 있어 없어 했어 하는 하고 해서 같은 같아 이렇게 그렇게 많이 조금 다들 아직 계속 했는데 뭐야 그게 이게 나는 너는 우리도 맞아 아니야 괜찮아 그러면 하면 해야 되는 되나 하는데 있는 ㅋㅋ ㅎㅎ 싶다 먹고 먹자 보자 갈래 하자 가자 다음 같이 해도 될까 어디 언제 몇시 하고싶다 먹을래'.split(' '));
function tok(t){return t.split(/[^가-힣a-zA-Z]+/).map(w=>w.length>2?w.replace(/(이랑|에서|한테|은|는|을|를|의|랑)$/,''):w).filter(w=>w.length>=2&&!STOP.has(w))}
function parseCsv(text){
const rows=[];let row=[],f='',q=false;
for(let i=0;i<text.length;i++){const c=text[i];
if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
else f+=c}
if(f||row.length){row.push(f);rows.push(row)}
const out=[];
for(const r of rows){const m=r[0]&&r[0].match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
if(!m||r.length<3||SYS.test(r[2]))continue;
out.push({n:r[1],d:new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]),t:r.slice(2).join(',')})}
return out}
function parse(text){
text=text.replace(/^﻿/,'');
if(/^\s*Date,User,Message/.test(text)||/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},"/.test(text))return parseCsv(text);
const out=[];let day=null;
const rDay=/^-*\s*(\d{4})년 (\d{1,2})월 (\d{1,2})일 \S+요일\s*-*$/;
const rPC=/^\[(.+?)\] \[(오전|오후) (\d{1,2}):(\d{2})\] (.*)$/;
const rMob=/^(\d{4})(?:년 |\. )(\d{1,2})(?:월 |\. )(\d{1,2})(?:일|\.) (?:(오전|오후) )?(\d{1,2}):(\d{2}), (.+?) : (.*)$/;
const rAny=/^\d{4}(년 |\. |-)\d/;
for(const line of text.split(/\r?\n/)){
let m;
if(m=line.match(rDay)){day=[+m[1],+m[2]-1,+m[3]];continue}
if(day&&(m=line.match(rPC))){out.push({n:m[1],d:new Date(day[0],day[1],day[2],to24(m[2],m[3]),+m[4]),t:m[5]});continue}
if(m=line.match(rMob)){out.push({n:m[7],d:new Date(+m[1],+m[2]-1,+m[3],to24(m[4],m[5]),+m[6]),t:m[8]});continue}
if(rAny.test(line)||SYS.test(line))continue;
if(out.length&&line.trim())out[out.length-1].t+='\n'+line;
}
return out;
}
const med=a=>{const s=[...a].sort((x,y)=>x-y);return s.length?s[Math.floor(s.length/2)]:0};
const best=(a,f)=>a.length?a.reduce((b,p)=>f(p)>f(b)?p:b):null;
const topN=(o,n)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,n);
const inc=(o,k,v=1)=>{o[k]=(o[k]||0)+v};
const cut=(s,n=42)=>{s=s.replace(/\s*\n\s*/g,' ');return s.length>n?s.slice(0,n)+'…':s};
const uniq=a=>{const s=new Set();return a.filter(m=>{const k=m.t.trim();if(s.has(k))return false;s.add(k);return true})};
const bub=(m,tag)=>`<div><p class="who">${esc(m.n)} · ${hm(m.d)}${tag?' · '+esc(tag):''}</p><span class="bub">${esc(cut(m.t))}</span></div>`;
function analyze(msgs){
msgs.sort((a,b)=>a.d-b.d);
const P={},hours=Array(24).fill(0),wds=Array(7).fill(0),months={},days={},words={},monthW={};
const g=n=>P[n]||(P[n]={n,c:0,media:0,laugh:0,night:0,start:0,rep:[],got:0,prom:0,w:{},tk:0,fun:[],opens:[],nights:[],proms:[],lt:{},maxL:0,repTo:{},mdays:{},dd:{},chars:0,txt:0,lb:{},la:{}});
let allTok=0,laughN=0,nightN=0,mediaN=0,promN=0,chars=0,txtN=0;
msgs.forEach((m,i)=>{
const p=g(m.n);p.c++;const h=m.d.getHours();hours[h]++;wds[m.d.getDay()]++;
const mo=m.d.getFullYear()*12+m.d.getMonth();inc(months,mo);
const tx=m.t.trim();m.md=MEDIA.test(tx);const lm=tx.match(/[ㅋㅎ]{2,}/g);m.lg=!!lm;
const k=dkey(m.d);inc(days,k);inc(p.dd,k);
if(m.md){p.media++;mediaN++;inc(p.mdays,k)}
else{const tk=tok(tx);tk.forEach(w=>{inc(words,w);inc(p.w,w);monthW[mo]=monthW[mo]||{};inc(monthW[mo],w)});p.tk+=tk.length;allTok+=tk.length;
if(!m.lg||tx.replace(/[ㅋㅎ\s]/g,'').length>3){p.chars+=tx.length;p.txt++;chars+=tx.length;txtN++}}
if(h<5){p.night++;nightN++;if(!m.md&&tx.replace(/[ㅋㅎ\s]/g,'').length>1)p.nights.push(m)}
if(m.lg){p.laugh++;laughN++;lm.forEach(l=>{p.maxL=Math.max(p.maxL,l.length);inc(p.lt,l.length>10?l.slice(0,10)+'…':l)})}
if(PROM.test(tx)){p.prom++;promN++;p.proms.push(m)}
const pv=msgs[i-1];const gap=pv?(m.d-pv.d)/6e4:1e9;
if(gap>180){p.start++;if(!m.md)p.opens.push(m)}
if(pv&&pv.n!==m.n&&gap<=30){p.rep.push(gap);(p.repTo[pv.n]=p.repTo[pv.n]||[]).push(gap)}
});
const pure=m=>m.lg&&m.t.replace(/[ㅋㅎ\s]/g,'').length<2;
msgs.forEach((x,j)=>{if(!x.lg)return;for(let i=j-1;i>=Math.max(0,j-6);i--){const m=msgs[i];if(x.d-m.d>5*6e4)break;if(m.md||pure(m))continue;if(m.n===x.n)break;(m.ls=m.ls||new Set()).add(x.n);break}});
msgs.forEach(m=>{m.lr=m.ls?m.ls.size:0;if(m.lr){const p=P[m.n];p.got+=m.lr;p.fun.push(m);m.ls.forEach(n=>{inc(p.lb,n);inc(P[n].la,m.n)})}});
const people=Object.values(P).sort((a,b)=>b.c-a.c);
const total=msgs.length;
people.forEach(p=>{p.sig=Object.entries(p.w).filter(([w,c])=>c>=3).map(([w,c])=>[w,c,(c/p.tk)/(words[w]/allTok)*Math.sqrt(c)]).sort((a,b)=>b[2]-a[2]).slice(0,5).map(x=>x[0])});
let el=people.filter(p=>p.c>=Math.max(10,total*0.01));if(!el.length)el=people;
const hk=topN(days,1)[0][0];
const hd=msgs.filter(m=>dkey(m.d)===hk);
const hw={},hh=Array(24).fill(0),hsp={};
hd.forEach(m=>{hh[m.d.getHours()]++;inc(hsp,m.n);if(!m.md)tok(m.t).forEach(w=>inc(hw,w))});
const topics=Object.entries(hw).filter(([w,c])=>c>=3).map(([w,c])=>[w,c,c*c/words[w]]).sort((a,b)=>b[2]-a[2]).slice(0,6).map(([w,c])=>({w,c,share:pc(c,words[w])}));
const ses=[];hd.forEach((m,i)=>{if(!i||m.d-hd[i-1].d>30*6e4)ses.push([]);ses[ses.length-1].push(m)});
const tl=ses.map(s=>{const sw={};s.forEach(m=>{if(!m.md)tok(m.t).forEach(w=>inc(sw,w))});
const tw=Object.entries(sw).filter(([w,c])=>c>=2).sort((a,b)=>b[1]*b[1]/words[b[0]]-a[1]*a[1]/words[a[0]])[0];
const cand=s.filter(m=>!m.md&&!(m.lg&&m.t.replace(/[ㅋㅎ\s]/g,'').length<2));
const ex=best(cand,m=>(m.lr||0)*100+Math.min(m.t.length,30));
return{s:s[0].d,e:s[s.length-1].d,c:s.length,w:tw?tw[0]:null,ex}}).sort((a,b)=>b.c-a.c).slice(0,5).sort((a,b)=>a.s-b.s);
const scene=best(hd.filter(m=>m.lr),m=>m.lr)||best(msgs.filter(m=>m.lr),m=>m.lr);
let sceneMsgs=[];if(scene){const i=msgs.indexOf(scene);sceneMsgs=msgs.slice(Math.max(0,i-2),i+5)}
const H={d:hd[0].d,c:hd.length,hh,sp:topN(hsp,3),topics,tl,scene,sceneMsgs,laugh:hd.filter(m=>m.lg).length,media:hd.filter(m=>m.md).length,first:hd[0],last:hd[hd.length-1]};
const mTop=Object.keys(months).map(Number).map(mo=>{const ws=monthW[mo]||{};const tw=Object.entries(ws).filter(([w,c])=>c>=3).sort((a,b)=>b[1]*b[1]/words[b[0]]-a[1]*a[1]/words[a[0]])[0];return{mo,c:months[mo],w:tw?tw[0]:null}}).sort((a,b)=>a.mo-b.mo);
return{msgs,people,el,total,hours,wds,mTop,days,words,H,laughN,nightN,mediaN,promN,avgLen:txtN?chars/txtN:0};
}
const PAL=[
{bg:'#FFE3EC',ink:'#4F2236',sub:'#8A5468',acc:'#E2588A'},
{bg:'#DDF3E8',ink:'#1F4536',sub:'#4F7A66',acc:'#2E9E6E'},
{bg:'#FFF1C2',ink:'#4D3B0B',sub:'#7F6A2E',acc:'#D08A00'},
{bg:'#DDE8FF',ink:'#1F3260',sub:'#50638F',acc:'#4A72D6'},
{bg:'#ECE3FF',ink:'#36245F',sub:'#685A8E',acc:'#8460D6'},
{bg:'#FFE6D6',ink:'#56301C',sub:'#8A5E48',acc:'#E06A35'}];
function build(A){
const S=[];let ci=0;const add=h=>S.push({c:ci++%PAL.length,h});
const T=A.total,first=A.msgs[0].d,last=A.msgs[T-1].d;
const span=Math.round((last-first)/864e5)+1;

function makePdf(imgs){const enc=new TextEncoder(),parts=[],off=[];let len=0;

obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
obj(2,`<< /Type /Pages /Kids [${imgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')}] /Count ${n} >>`);
imgs.forEach((im,i)=>{const p=3+3*i,W=(im.w/2).toFixed(2),H=(im.h/2).toFixed(2);
obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${p+1} 0 R >> >> /Contents ${p+2} 0 R >>`);
off[p+1]=len;push(`${p+1} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);push(im.bytes);push('\nendstream\nendobj\n');

const xref=len,total=3+3*n;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let k=1;k<total;k++)x+=String(off[k]).padStart(10,'0')+' 00000 n \n';

function show(){

}
function go(msgs){
if(msgs.length<20){$('kr-err').textContent='메시지를 20개 이상 읽어야 분석할 수 있어요. 내보낸 파일이 맞는지 확인해 주세요.';return}
$('kr-err').textContent='';
S=build(analyze(msgs));PDF=null;cur=0;$('kr-start').style.display='none';$('kr-guide').innerHTML='';show();
}
function run(text){try{go(parse(text))}catch(e){$('kr-err').textContent='분석 중 오류가 났어요: '+e.message}}
const fix=s=>{if(!s||/[^\u0000-ÿ]/.test(s))return s||'';try{return new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(s,c=>c.charCodeAt(0)))}catch(e){return s}};
const ISYS=/(Liked a message|Reacted .* to your message|메시지에 공감|님이 공감|메시지 전송을 취소|unsent a message|started a video chat|영상 채팅|음성 통화|missed (a|your) (video|audio) call|changed the group|님이 그룹|named the group|added .* to the group|left the group)/i;
function fromInsta(js){
const out=[];
js.forEach(j=>(j.messages||[]).forEach(m=>{
let t=m.content!=null?fix(m.content):'';
if(m.photos)t='사진';else if(m.videos)t='동영상';else if(m.audio_files)t='음성메시지';else if(m.sticker||m.gifs)t='이모티콘';else if(m.files)t='파일: 첨부';else if(m.share&&(!t||/sent an attachment|첨부 파일을 보냈습니다/.test(t)))t='링크';
if(!t||ISYS.test(t)||!m.timestamp_ms)return;
out.push({n:fix(m.sender_name||'알 수 없음'),d:new Date(m.timestamp_ms),t})}));
return out}
let threads={};
function pickThread(){
const list=Object.values(threads).sort((a,b)=>b.c-a.c);
if(list.length===1){const m=fromInsta(list[0].js);if(m.length<20){$('kr-err').textContent=`이 대화는 메시지가 ${m.length}개뿐이라 분석하기 어려워요.`;return}go(m);return}
const P0=PAL[4],q=($('kr-q')||{}).value||'';
const rows=list.filter(t=>!q||t.title.includes(q)).slice(0,40);
$('kr-guide').innerHTML=`<div class="card" style="--bg:${P0.bg};--ink:${P0.ink};--sub:${P0.sub};--acc:${P0.acc};cursor:default;min-height:0"><p class="kick">대화방 고르기</p><p class="ttl j">어떤 대화를 볼까요?</p><input id="kr-q" placeholder="이름으로 찾기" value="${esc(q)}" style="width:100%;margin-bottom:10px;border-radius:12px;border:0;padding:9px 12px;font:inherit;font-size:14px;background:#fff;color:#2b2328">${rows.map(t=>`<button class="thr" data-k="${esc(t.k)}"><span class="j" style="font-size:16px">${esc(t.title)}</span><br><span style="font-size:12px;color:var(--sub)">${t.people}명 · 메시지 약 ${fmt(t.c)}개</span></button>`).join('')||'<p class="lab">찾는 대화가 없어요</p>'}</div><div style="text-align:center;margin-top:10px"><button id="kr-back2" style="background:transparent;color:var(--text-secondary);font-size:13px">처음으로</button></div>`;
$('kr-q').oninput=()=>{const v=$('kr-q').value;pickThread();const e=$('kr-q');e.focus();e.setSelectionRange(v.length,v.length)};
document.querySelectorAll('.thr').forEach(b=>b.onclick=()=>{const m=fromInsta(threads[b.dataset.k].js);if(m.length<20){$('kr-err').textContent=`이 대화는 메시지가 ${m.length}개뿐이라 분석하기 어려워요. 다른 대화를 골라 주세요.`;return}go(m)});
$('kr-back2').onclick=home;
}
const say=(m,bad)=>{const e=$('kr-st');if(e){e.style.display=m?'block':'none';e.style.color=bad?'#A32D2D':'var(--ink)';e.innerHTML=m}else $('kr-err').textContent=m.replace(/<[^>]+>/g,' ')};
const readAs=(f,how)=>new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=()=>no(fr.error||new Error('파일을 읽지 못했어요'));how==='buf'?fr.readAsArrayBuffer(f):fr.readAsText(f,'utf-8')});
const mb=n=>(n/1048576).toFixed(n>1048576*10?0:1)+'MB';
function needZip(){return window.JSZip?Promise.resolve():new Promise((ok,no)=>{const u=['https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js','https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'];let i=0;const tryi=()=>{if(i>=u.length)return no(new Error('zip 도구를 불러오지 못했어요'));const sc=document.createElement('script');sc.src=u[i++];sc.onload=()=>window.JSZip?ok():tryi();sc.onerror=tryi;document.head.appendChild(sc)};tryi()})}
async function insta(files){
$('kr-err').textContent='';threads={};let html=0,tried=[];
const addJ=(j,path)=>{if(!j||!Array.isArray(j.messages))return;const k=j.thread_path||path.replace(/\/[^/]*$/,'')||'x';const t=threads[k]||(threads[k]={k,js:[],c:0,title:fix(j.title)||(j.participants||[]).map(p=>fix(p.name)).join(', ')||'대화',people:(j.participants||[]).length});t.js.push(j);t.c+=j.messages.length};
try{
say(`파일 ${files.length}개를 받았어요: ${files.map(f=>esc(f.name)+' ('+mb(f.size)+')').join(', ')}`);
for(const f of files){
const head=new Uint8Array(await readAs(f.slice(0,4),'buf'));const isZip=head[0]===0x50&&head[1]===0x4B;
if(isZip){
say(`zip 여는 중... (${esc(f.name)}, ${mb(f.size)})${f.size>300*1048576?'<br>파일이 커서 시간이 걸리거나 휴대폰에서 멈출 수 있어요':''}`);
await needZip();
const z=await JSZip.loadAsync(await readAs(f,'buf'));
const all=Object.keys(z.files).filter(p=>!z.files[p].dir);
const ps=all.filter(p=>/(^|\/)messages\/(inbox|message_requests|archived_threads|e2ee_cutover)\/[^/]+\/message_\d+\.json$/i.test(p)||/(^|\/)message_\d+\.json$/i.test(p));
html+=all.filter(p=>/message_\d+\.html$/i.test(p)).length;
tried=tried.concat(all);
say(`zip 안 파일 ${fmt(all.length)}개 중 대화 파일 ${ps.length}개를 찾았어요. 읽는 중...`);
let i=0;for(const p of ps){addJ(JSON.parse(await z.file(p).async('string')),p);if(++i%20===0)say(`대화 파일 읽는 중... ${i}/${ps.length}`)}
}else{say(`${esc(f.name||'파일')} 읽는 중...`);const tx=(await readAs(f,'txt')).replace(/^\uFEFF/,'').trim();
if(tx[0]==='{'){let j;try{j=JSON.parse(tx)}catch(e){throw new Error('JSON 파일이 잘렸거나 깨진 것 같아요')}if(Array.isArray(j.messages))addJ(j,f.name||'x');else tried.push((f.name||'파일')+' (메시지가 없는 json)')}
else if(tx[0]==='<')html++;
else tried.push(f.name||'파일')}
}
if(!Object.keys(threads).length){
const hint=tried.filter(p=>/messag|inbox/i.test(p)).slice(0,4);const smp=(hint.length?hint:tried.slice(0,4)).map(p=>`<br>· ${esc(p)}`).join('');
say(html?'HTML 형식으로 받은 파일이에요. 내보내기 설정에서 형식을 JSON으로 바꿔 다시 요청해 주세요.':`대화 파일을 찾지 못했어요. 내보낼 때 정보에서 메시지를 골랐는지, zip이 여러 개라면 다른 zip에 있는지 확인해 주세요.${smp?'<br><br>파일 안에 이런 게 있었어요:'+smp:''}`,true);return}
say('');$('kr-st').style.display='none';
pickThread();
}catch(e){say('파일을 읽다가 오류가 났어요: '+esc(e.message||String(e)),true)}
}
const st=(i,h)=>`<div class="step"><span class="n">${i}</span><div>${h}</div></div>`;
function guide(src){
$('kr-err').textContent='';$('kr-start').style.display='none';
const k=src==='kakao',P0=PAL[k?2:4];
$('kr-guide').innerHTML=`<div class="card" style="--bg:${P0.bg};--ink:${P0.ink};--sub:${P0.sub};--acc:${P0.acc};cursor:default;min-height:0"><div class="dot" style="width:140px;height:140px;right:-50px;top:-50px"></div><div class="in"><p class="kick">${k?'카카오톡':'인스타그램 DM'}</p><p class="ttl j">먼저 대화를<br>내보내 주세요</p>${k?`<p class="j" style="font-size:16px;margin:0 0 8px">휴대폰 (아이폰 · 안드로이드)</p>${st(1,'분석할 채팅방에 들어가요')}${st(2,'오른쪽 위 <em>≡ 메뉴</em>를 누르고, 아래쪽 <em>톱니바퀴(설정)</em>로 가요')}${st(3,'<em>대화 내용 내보내기 → 텍스트만 보내기</em>를 골라요')}${st(4,'파일로 저장해요. 아이폰은 <em>파일에 저장</em>을 고르면 돼요')}<p class="j" style="font-size:16px;margin:14px 0 8px">PC · 맥</p>${st(1,'채팅방 <em>≡ 메뉴 → 대화 내용 → 대화 내보내기</em>')}${st(2,'저장된 .txt 파일을 올려요 (맥은 .csv)')}<div class="tip">메뉴 이름은 카톡 버전마다 조금 다를 수 있어요. 사진은 빼고 텍스트만 내보내야 빨라요.</div>`:`${st(1,'인스타 앱에서 프로필 → 오른쪽 위 <em>≡</em> → <em>계정 센터</em>로 가요')}${st(2,'<em>내 정보 및 권한 → 내 정보 내보내기 → 내보내기 만들기</em>')}${st(3,'인스타 프로필을 고르고 <em>기기로 내보내기</em>를 눌러요')}${st(4,'세부 설정을 바꿔요<br>· 정보: <em>메시지</em>만 체크<br>· 기간: <em>전체 기간</em><br>· 형식: <em>JSON</em> (꼭!)<br>· 미디어 화질: <em>낮음</em>')}${st(5,'<em>내보내기 시작</em>을 누르고, 준비됐다는 메일이 오면 zip 파일을 받아요')}${st(6,'zip 파일을 그대로 아래에 올리면 대화방을 고를 수 있어요')}<div class="tip">형식을 HTML로 받으면 분석이 안 돼요. 계정 센터가 "Meta 계정"으로 보일 수도 있는데 안의 메뉴는 같아요.</div>`}<div class="box" style="margin-top:6px"><p class="lab" style="margin-bottom:8px">${k?'내보낸 파일 올리기 (.txt / .csv)':'zip 파일 또는 message_1.json 하나 올리기'}</p><input type="file" id="kr-file" style="width:100%;font-size:13px"><p id="kr-st" style="display:none;font-size:13px;margin:10px 0 0;line-height:1.5;word-break:break-all"></p></div>${k?`<p class="lab" style="margin:10px 0 6px">또는 대화 내용을 직접 붙여넣기</p><textarea id="kr-text" rows="3" placeholder="2026년 3월 5일 오후 3:24, 민지 : 오늘 뭐함" style="border:0;background:#fff;color:#2b2328"></textarea><button id="kr-go" style="width:100%;margin-top:8px;background:var(--acc);color:#fff">붙여넣은 대화 분석하기</button>`:''}</div></div><div style="text-align:center;margin-top:10px"><button id="kr-back" style="background:transparent;color:var(--text-secondary);font-size:13px">처음으로</button></div>`;
$('kr-back').onclick=home;
window.addEventListener('unhandledrejection',e=>say('오류가 났어요: '+esc((e.reason&&e.reason.message)||String(e.reason)),true));
$('kr-file').addEventListener('change',e=>{const fs=[...e.target.files];if(!fs.length)return;
if(k){const fr=new FileReader();fr.onload=()=>run(fr.result);fr.onerror=()=>{$('kr-err').textContent='파일을 읽지 못했어요. 내용을 붙여넣어 주세요.'};fr.readAsText(fs[0],'utf-8')}else insta(fs)});
if(k){$('kr-go').onclick=()=>{const v=$('kr-text').value.trim();if(!v){$('kr-err').textContent='붙여넣은 내용이 없어요.';return}run(v)};$('kr-text').oninput=()=>{$('kr-err').textContent=''}}
}
function home(){$('kr-view').innerHTML='';$('kr-guide').innerHTML='';$('kr-err').textContent='';$('kr-start').style.display=''}
$('kr-kakao').addEventListener('click',()=>guide('kakao'));
$('kr-insta').addEventListener('click',()=>guide('insta'));
function makeSample(){
let s=7;const r=()=>{s=(s*16807)%2147483647;return(s-1)/2147483646};
const pick=a=>a[Math.floor(r()*a.length)];
const N=['민지','준호','서연','도윤','하은'],W=[5,3,3,2,2],WT=W.reduce((a,b)=>a+b);
const wp=()=>{let x=r()*WT,i=0;while(i<4&&(x-=W[i])>0)i++;return N[i]};
const OP={민지:['얘들아','오늘 뭐함','심심한 사람'],준호:['나 방금 대박 사건','ㅎㅇ'],서연:['점심 뭐 먹지','이거 봤어?'],도윤:['자는 사람?','잠 안 오는 사람'],하은:['오늘 하늘 봐','사진']};
const pool=['배고프다','과제 언제까지야','시험 망함','이모티콘','헐 진짜?','넷플릭스 신작 재밌더라','주말에 뭐해','알바 끝남','졸려','치킨 먹고 싶다','과제 다했어?','교수님 출석 부름','마라탕 먹고 싶다','중간고사 범위 어디까지야','떡볶이 먹으러 가자'];
const promP=['다음에 밥 먹자','조만간 한번 보자','나중에 술 마시자','시험 끝나면 놀자'];
const fun=['나 지하철 반대로 탐','알람 7개 맞췄는데 다 끄고 잠','교수님이 내 이름 틀리게 부름','라면 물 두 배 넣음','과제 냈는데 빈 파일이었음','버스 놓쳐서 뛰었는데 그 버스 아니었음'];
const nightP=['잠이 안 온다','인생 뭘까','갑자기 배고프다','내일 1교시인데 망함','다들 자?','별 보러 가고 싶다'];
const trip=['부산 여행 가자','기차표 예매했어','숙소 어디로 해','해운대 갈래 광안리 갈래','여행 일정 짜자','기차 몇시야','숙소 결제함','돼지국밥 먹자','회 먹으러 가자','광안리 야경 보자','부산 진짜 기대된다','숙소 체크인 몇시','해운대 바다 보자'];
const tripFun=['기차표 3시인줄 알았는데 1시였음','숙소 사진이랑 실물 너무 다름','나 수영복 없음','부산 사투리 연습 중임'];
const hrs=[10,12,13,15,18,19,20,21,21,22,22,23,23,0,1,2];
const L=[];
for(let d=new Date(2026,0,1);d<new Date(2026,10,16);d.setDate(d.getDate()+1)){
const burst=d.getMonth()===6&&d.getDate()===14;
const sess=burst?8:Math.floor(r()*3);
for(let q=0;q<sess;q++){
let t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),burst?9+q*2:pick(hrs),Math.floor(r()*60));
const cnt=burst?40:5+Math.floor(r()*30);let fl=0,fa=null;
for(let k=0;k<cnt;k++){
t=new Date(t.getTime()+Math.floor(r()*4)*6e4);
const h=t.getHours();let n=wp();if(h<5&&r()<.5)n='도윤';let x;
if(k===0)x=pick(OP[n]);
else if(fl>0&&n!==fa&&r()<.8){x=n==='서연'?'ㅋㅋㅋㅋㅋㅋ 미쳤다':pick(['ㅋㅋㅋ','ㅋㅋㅋㅋ','ㅋㅋㅋㅋㅋㅋㅋㅋ','ㅎㅎㅎ']);fl--}
else if(h<5&&n==='도윤'&&r()<.6)x=pick(nightP);
else if(n==='준호'&&r()<.3){x=pick(burst?tripFun:fun);fl=3;fa=n}
else if(n==='하은'&&r()<.35)x=pick(['사진','사진 3장','동영상']);
else if(r()<.08)x='ㅋㅋ';
else x=pick(burst?trip:pool);
L.push(`${t.getFullYear()}년 ${t.getMonth()+1}월 ${t.getDate()}일 ${h<12?'오전':'오후'} ${h%12||12}:${String(t.getMinutes()).padStart(2,'0')}, ${n} : ${x}`);
}}}
return L.join('\n');
}
$('kr-sample').addEventListener('click',()=>{$('kr-err').textContent='';try{go(parse(makeSample()))}catch(e){$('kr-err').textContent='분석 중 오류가 났어요: '+e.message}});
})();
